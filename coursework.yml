# coursework.yml — single source of truth for the /coursework page on simo899t.github.io
#
# semesters[] -> courses[] -> sections[] -> items[].  Order here = order on the page.
# An item is one of:
#   pdf:    <repo-relative path to a compiled PDF>   -> bundled at /coursework/pdf/<hash>.pdf
#   url:    <external link, e.g. a project/exam repo> -> not bundled
#   source: <repo path or URL>   alone = 'source only' (PDF not compiled yet); with pdf/url = extra link
# Optional per item: description, updated (YYYY-MM-DD; else from git history).
# A pdf: path that doesn't exist fails the CI build.
#
# --- workflow: compile a note's PDF, commit it, add a `pdf:` line here, push. ---

