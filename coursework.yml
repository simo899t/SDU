# coursework.yml — single source of truth for the /coursework page on simo899t.github.io
#
# Shape:  semesters[] -> courses[] -> sections[] -> items[]
# An item is EITHER a bundled PDF or an external link:
#   - title: "Lecture 1"
#     pdf: 5sem/AI509-.../lec01/notes.pdf      # repo-relative path, served at /coursework/pdf/<hash>.pdf
#     source: 5sem/AI509-.../lec01/notes.typ   # optional; a repo path -> GitHub blob link, or a full URL
#     description: "..."                       # optional
#     updated: 2026-09-01                       # optional; omitted -> derived from git history of the pdf
#   - title: "Whole repo folder"
#     url: https://github.com/simo899t/SDU/tree/main/5sem/...   # external link instead of a bundled PDF
#
# Order here is the order on the page. Section names are free text.
# A missing `pdf:` file fails the build, so broken paths are caught in CI.

intro: >-
  Every set of lecture notes, exercise solution and assignment I wrote during my
  Computer Science / AI degree at SDU, organised by semester and course.
  Each links to its Typst source on GitHub.

