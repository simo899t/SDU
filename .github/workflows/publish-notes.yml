name: Publish notes hub

# Regenerates the coursework manifest + PDF copies and pushes them into the
# simo899t.github.io repo, which then runs its own Pages deploy.

on:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '**/*.typ'
      - 'notes-meta.json'
      - 'scripts/generate_notes_manifest.py'
      - '.github/workflows/publish-notes.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDU
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log needs history for "last modified" dates

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate manifest + PDF copies
        run: python3 scripts/generate_notes_manifest.py --out build/coursework

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: simo899t/simo899t.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: site

      - name: Sync into site/public/coursework
        run: |
          rm -rf site/public/coursework
          mkdir -p site/public/coursework
          cp -r build/coursework/. site/public/coursework/

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name  "notes-bot"
          git config user.email "notes-bot@users.noreply.github.com"
          git add public/coursework
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: sync coursework hub from SDU@${GITHUB_SHA::7}"
            git push
          fi
